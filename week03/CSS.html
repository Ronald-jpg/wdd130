 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boxing Example</title>
  <style>
    /* Add your styles below */
    .box {
      margin: 1rem;              /* space outside the box */
      padding: 1rem;             /* space inside the box */
      border: 2px solid #333;    /* simple border */
      background-color: #00ff00; /* light decorative background */
      color: #222;               /* text color */
    }

    /* Aside rule without duplicated properties */
    aside {
      font-style: bold;
      width: 250px;
    }
    aside h2 {
  position: absolute;
  top: 47px;
  left: 150px;
}
*img {
  /* you most likely will have other CSS declarations here */
  float: right;
}
*p {

    align-content: center;

}
  </style>
</head>
<body>
  <div class="box">
    <h2>Kakaire Ronald | WWD130. </h2>
    <p>My name am called Ronald and am from Uganda i enjoy playing football, swimming and <travelling class="hr"></travelling>
         Am a member in the church of Jesus Christ of Latter Day Saints.</p>
         <img src="img11.png" alt="">
    
  </div>
  <p>Float profile image example</p>

  <aside class="h2">
    This is an aside element style.
  </aside>
</body>
</html>
